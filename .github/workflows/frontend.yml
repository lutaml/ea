name: Windows font diagnostic (never merge)
run-name: Windows GDI font diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese supplemental fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics/windows-fonts/results | Out-Null
          $capability = Get-WindowsCapability -Online -Name 'Language.Fonts.Jpan~~~und-JPAN~0.0.1.0'
          $capability | ConvertTo-Json | Set-Content diagnostics/windows-fonts/results/capability-before.json
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name | ConvertTo-Json | Set-Content diagnostics/windows-fonts/results/capability-install.json
          }
          $after = Get-WindowsCapability -Online -Name $capability.Name
          $after | ConvertTo-Json | Set-Content diagnostics/windows-fonts/results/capability-after.json
          if ($after.State -ne 'Installed') { throw 'Japanese supplemental fonts unavailable' }
      - name: Compile and measure GDI fonts
        shell: pwsh
        run: ./diagnostics/windows-fonts/Measure-Fonts.ps1
      - name: Upload numbers and metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-gdi-font-measurements
          path: diagnostics/windows-fonts/results/*.json
          if-no-files-found: error
