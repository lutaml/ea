name: Legend GDI diagnostic (never merge)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Japanese supplemental fonts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $capability = Get-WindowsCapability -Online -Name 'Language.Fonts.Jpan~~~und-JPAN~0.0.1.0'
          if ($capability.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $capability.Name
          }
          if ((Get-WindowsCapability -Online -Name $capability.Name).State -ne 'Installed') {
            throw 'Japanese supplemental fonts unavailable'
          }
      - name: Measure exact H16 and H17 configurations
        shell: pwsh
        run: ./diagnostics/legend-fonts/Measure-LegendFonts.ps1
      - name: Upload metadata and numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legend-gdi-h16-h17
          path: diagnostics/legend-fonts/results/*.json
          if-no-files-found: error
