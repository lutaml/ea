inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.2
  # Stray git worktrees inside the checkout shadow lib/ files on the
  # load path; keep the linter out of them too.
  Exclude:
    - "wt-*/**/*" 

# Spec suites legitimately run long describe/it blocks and setup
# methods; size-complexity cops apply to library code only.
Metrics:
  Exclude:
    - "spec/**/*"

# The codebase does not follow comment-every-module discipline; the
# cop is noise at this scale.
Style/Documentation:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes
